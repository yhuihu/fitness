<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身计划制定器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.5/antd.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@4.8.4/dist/index.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@17/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@4.24.5/dist/antd.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .ant-card {
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .ant-card-head {
            border-bottom: 1px solid #f0f0f0;
            background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
        }
        .ant-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .ant-btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a5ac0 100%);
        }
        .rest-timer {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 12px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .current-plan {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            border-radius: 12px;
        }
        .stat-card {
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        @media (max-width: 640px) {
            body { padding: 10px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="text/babel">
        window.App = function() {
            return (
                <div className="container" style={{ maxWidth: '480px', margin: '0 auto', padding: '16px' }}>
                    <Card className="mb-6" style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', border: 'none', color: 'white' }}>
                        <Row justify="center" gutter={16}>
                            <Col>
                                <h1 style={{ fontSize: '28px', margin: 0 }}>💪 健身计划制定器</h1>
                                <p style={{ opacity: 0.9, marginTop: 8 }}>Vivo X200 Pro Mini Edition</p>
                            </Col>
                        </Row>
                    </Card>

                    <Card title="📋 基本设置" className="mb-6">
                        <Form
                            layout="vertical"
                            onFinish={this.handlePlanStart}
                            initialValues={{ planName: '', cycleDuration: 30 }}
                        >
                            <Form.Item
                                label="计划名称"
                                name="planName"
                                rules={[{ required: true, message: '请输入计划名称' }]}
                            >
                                <Input placeholder="例如：力量训练计划" />
                            </Form.Item>
                            <Form.Item
                                label="循环时长（分钟）"
                                name="cycleDuration"
                                initialValue={30}
                                rules={[{ required: true, type: 'number', min: 5, max: 120, message: '最小5分钟，最大120分钟' }]}
                            >
                                <Input type="number" min={5} max={120} style={{ width: '100%' }} />
                            </Form.Item>
                            <Button
                                type="primary"
                                htmlType="submit"
                                block
                                style={{ height: '44px', fontSize: '16px', borderRadius: '8px' }}
                            >
                                添加训练项
                            </Button>
                        </Form>
                    </Card>

                    <Card title="🏃 训练计划列表" className="mb-6">
                        {planItems.length === 0 ? (
                            <Empty description="还没有训练项，点击上方按钮添加吧！" />
                        ) : (
                            <List
                                dataSource={planItems}
                                renderItem={this.renderPlanItem}
                                bordered
                                size="small"
                            />
                        )}
                    </Card>

                    <Row gutter={16}>
                        <Col span={12}>
                            <Card title="🎯 当前计划" className="h-full">
                                {currentItemIndex < planItems.length ? (
                                    <div>
                                        <Text type="secondary">当前进度</Text>
                                        <h2 style={{ margin: '8px 0', fontSize: '20px' }}>{planItems[currentItemIndex].name}</h2>
                                        <Text type="secondary">第 {currentItemIndex + 1} / {planItems.length} 项</Text>
                                    </div>
                                ) : (
                                    <div>
                                        <Empty description="计划完成" />
                                    </div>
                                )}
                            </Card>
                        </Col>
                        <Col span={12}>
                            <Card title="⏱️ 组间休息" className="h-full">
                                {restRemainingTime > 0 ? (
                                    <div className="rest-timer" style={{ textAlign: 'center', padding: '16px' }}>
                                        <Text strong style={{ fontSize: '32px', color: '#333' }}>{restRemainingTime}</Text>
                                        <Text type="secondary">秒</Text>
                                        <Progress percent={Math.round(((restRemainingTime / (planItems[currentItemIndex]?.rest || 60)) * 100))} showInfo={false} strokeColor="#764ba2" />
                                    </div>
                                ) : (
                                    <div style={{ textAlign: 'center', padding: '16px' }}>
                                        <Empty description="休息后将显示倒计时" />
                                    </div>
                                )}
                            </Card>
                        </Col>
                    </Row>

                    <Row gutter={16} style={{ marginTop: 16 }}>
                        <Col span={24} style={{ textAlign: 'center' }}>
                            <Space>
                                <Button
                                    type="primary"
                                    size="large"
                                    icon={<PlayCircleOutlined />}
                                    onClick={this.handlePlanStart}
                                    disabled={planItems.length === 0}
                                >
                                    开始训练
                                </Button>
                                <Button
                                    size="large"
                                    icon={<FastForwardOutlined />}
                                    onClick={this.handleSkipRest}
                                    style={{ display: 'none' }}
                                >
                                    跳过休息
                                </Button>
                            </Space>
                        </Col>
                    </Row>
                </div>
            );
        };
    </script>
</body>
</html>
